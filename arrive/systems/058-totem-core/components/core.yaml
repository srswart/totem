  stage: incubating
  description: "Domain model: typed memory categories, scopes, provenance, value/currency ledger, retrieval ranking"

selectors:
  paths:
    - "crates/totem-core/**"
    - "src/**"
  build_modules: []
  tags: []
  contracts: []

