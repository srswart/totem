              tab reinforces every record it displays — the tool for looking
              at the corpus is a writer to it. Same mechanism contaminated
              ADV-CORE-008's own before/after: the currency bound was never
              exercised against the deployment. A product decision, not a
              test affordance.
          - id: "ADV-STORE-009"
            advance_id: "ADV-STORE-009"
            title: "The calibration corpus becomes a versioned artifact, not compiled-in code"
            status: planned
            owner: "058-totem"
            dependencies: ["ADV-CORE-008"]
            notes: >-
              corpus.rs cannot be versioned independently of the code under
              test, cannot grow, and cannot change without a rebuild. Records
              must carry economics and the golden queries must live in the
              same artifact — ADV-CORE-008 proved a corpus with uniform
              economics cannot fail.
          - id: "ADV-INFRA-007"
            advance_id: "ADV-INFRA-007"
            title: "A calibration estate: enrol, seed, measure, discard, repeat"
            status: planned
            owner: "058-totem"
            dependencies: ["ADV-STORE-009", "ADV-GATEWAY-017", "ADV-INFRA-006"]
            notes: >-
              Calibration has nowhere to happen: the only estate with the
              real embedder is the one holding real memories. Episodic rows
              are append-only, so reset means a fresh container, not a
              delete — the advance chooses namespace vs deployment vs local
              and records why. Depends on INFRA-006 because each iteration
              otherwise costs a full rebuild.
          - id: "ADV-INFRA-008"
            advance_id: "ADV-INFRA-008"
            title: "Build parallelism is computed, and the one network step is retried"
            status: done
            owner: "058-totem"
            dependencies: ["ADV-INFRA-006"]
            notes: >-
              WORKSTATION. CARGO_BUILD_JOBS=2, set during STORE-008 to stop a
              real OOM and never revisited, throttled the step that is ~94%
              of a cold build. Now computed as min(cores, RAM_GB) because the
              constraint is memory per rustc and the builder is a managed
              Depot one we cannot inspect. Also retries the model download —
              the build's only network dependency, which failed a build
              during this investigation and looked like an OOM.
