# ARRIVE Registry - Repo-wide defaults and shared configuration
registry:
  repo_id: 058-totem
  name: "058 Totem"
  description: "Totem — durable, auditable typed-memory and shared-context system for AI agents, mirroring the ARRIVE landscape of enrolled repos"
  # The `owner/name` GitHub identity, in the same id space
  # `totem_recall`/`totem_save`'s `project` field and gateway credentials
  # (`TokenGrant.repo`) use. Distinct from `repo_id` above (ARRIVE's own
  # governance-registry id, e.g. `058-totem`) — the two id spaces
  # ADV-GATEWAY-009 unifies so a credential can be bound to its landscape.
  git_repo: srswart/totem

# Optional org placement for fleet/portfolio rollups (ARRIVE Adoption Intelligence,
# TD-INSIGHT-009). Aggregate / team-level only — never per-developer. All fields
# optional; repos that omit this group under "Unassigned". `arrive init` captures
# these interactively or via --portfolio / --pillar / --team (blanks omitted).
# They can also be set via the insight active-repo registry override.
# org:
#   portfolio: "<portfolio name>"
#   pillar: "<pillar name>"
#   team: "<team name>"

defaults:
  # Must match the repository's actual default branch: `arrive score` resolves
  # the merge base against `origin/<default_branch>` and `arrive sync server`
  # refuses to run from any other branch.
  default_branch: master
  # Advance ID format: ADV-<PRIMARY_COMPONENT>-<SEQ:3>
  # Example: ADV-STATUS-001, ADV-AUTH-002, ADV-REVIEWABILITY-003
  # The primary component identifies what was mainly changed
  advance_id_format: "ADV-{COMPONENT}-{SEQ:3}"
  
vocabulary:
  stages:
    - incubating   # Early stage, flexible, learning/rapid iteration
    - candidate    # Stabilized enough for normal governance
    - resident     # High trust + high scrutiny; stricter gates

  component_types:
    - service
    - library
    - ui-area
    - infra
    - data-contract
    - crosscutting

  risk_flags:
    - resident_touched
    - migration
    - auth
    - concurrency
    - caching
    - public_api
    - new_dependency

  evidence_types:
    - ci:passed
    - tests:unit
    - tests:integration
    - tests:e2e
    - review:owner
    - docs:updated
    - tdd:red-green        # Tests written first, then implementation
    - tidy:preparatory     # Tidying commits preceded feature work

  commit_prefixes:
    - tidy     # Preparatory refactoring (no behavior change)
    - test     # New or modified tests
    - feat     # New feature implementation
    - fix      # Bug fix implementation
    - docs     # Documentation only
    - chore    # Build, CI, tooling changes

  # File annotation format for tagging scattered files
  annotation:
    pattern: "@arrive component:"  # Pattern to search for
    scan_lines: 50                 # Scan first N lines of each file
    extensions:                    # File extensions to scan for annotations
      - .rs
      - .ts
      - .tsx
      - .js
      - .jsx
      - .py
      - .go
      - .java
      - .kt
      - .swift
      - .yaml
      - .yml
      - .toml

systems:
  - 058-totem-core

