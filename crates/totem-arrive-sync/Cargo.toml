[package]
name = "totem-arrive-sync"
version = "0.1.0"
description = "Ingestion of an enrolled repo's /arrive/ artifacts into the Totem landscape graph"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
# `sync_repo` is generic over `surrealdb::Connection` (it only ever calls
# `Store::landscape()`, never touches a connection directly), so this crate's
# own code needs no engine feature. `kv-mem` is enabled because the doctest
# and tests/dogfood.rs build their own embedded store to sync against — the
# same engine every test in this workspace uses.
surrealdb = { workspace = true, features = ["kv-mem"] }
thiserror.workspace = true
totem-store = { path = "../totem-store" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
