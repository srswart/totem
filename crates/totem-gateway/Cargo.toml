[package]
name = "totem-gateway"
version = "0.1.0"
description = "Axum REST API exposing recall/save with provenance and an access log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "totem-gateway"
path = "src/main.rs"

[[bin]]
name = "mcp_stdio"
path = "src/bin/mcp_stdio.rs"

[dependencies]
# TD-009 (docs/tech-direction/surrealdb.md §5): the gateway's own SurrealDB
# connection must be embedded or WebSocket, never HTTP, or live queries are
# refused. `axum = "0.8"` matches the pin ADV-GATEWAY-005 measured rmcp's
# server feature against, so ADV-GATEWAY-002 mounts on the same router with no
# version reconciliation.
anyhow = "1.0"
# The landscape event relay (ADV-CONSOLE-003) builds its `text/event-stream`
# body with the `stream!` macro rather than hand-rolling a `Stream` impl with
# `futures::stream::unfold`; already present in `Cargo.lock` via rmcp's own
# dependency tree, so this adds no new crate to the build.
async-stream = "0.3"
axum = "0.8"
# Static file serving for the console (ADV-GATEWAY-010). `fs` only — the
# gateway needs a directory server and an SPA fallback, nothing else.
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
percent-encoding = "2"
# Already in the lock via surrealdb; direct dependencies here so the OAuth
# resource server (ADV-GATEWAY-013) validates tokens with the same version.
jsonwebtoken = "10.3"
# Pinned to the version rmcp 3.1.0 already pulls in, so the gateway compiles
# one HTTP stack rather than two. (The TLS feature is `rustls` on 0.13 and
# `rustls-tls` on 0.12 — a rename that quietly hid the duplication.)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
chrono.workspace = true
# Pinned exactly, matching totem-mcp-spike's pin: docs/tech-direction/mcp.md
# (ADV-GATEWAY-005) verified this exact version's stdio and streamable-HTTP
# transports end-to-end and named re-verifying the pin at ADV-GATEWAY-002 time
# as a standing instruction, not a one-time check. Both transports are wired
# up now: stdio for desktop harnesses (ADV-GATEWAY-002) and
# `transport-streamable-http-server` for cloud agents (ADV-GATEWAY-003), the
# latter only ever mounted behind this crate's bearer-credential layer.
rmcp = { version = "=3.1.0", features = [
    "transport-io",
    "transport-streamable-http-server",
] }
serde.workspace = true
serde_json.workspace = true
# Credential fingerprints. The registry stores SHA-256 of each token and never
# the token itself, so a state dump is not a credential dump (ADV-GATEWAY-003).
sha2 = "0.10"
# Named directly only for the embedded engine's `Db` connection type
# (`AppState`'s field type); every query goes through `totem-store`'s
# repositories, never a raw `Surreal<C>` this crate holds itself.
surrealdb = { workspace = true, features = ["kv-mem"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
totem-core = { path = "../totem-core" }
totem-store = { path = "../totem-store" }
# Opaque credential material: two v4 UUIDs, the same shape and the same
# CSPRNG-backed source `totem-cli`'s `credential::issue` already uses, so a
# CLI-issued credential and a gateway-issued one are indistinguishable.
uuid.workspace = true

[features]
# DEP-001 durable mode: build with this and set TOTEM_DATA_DIR to run the
# gateway as the durable shared instance. Off by default so cloud/CI builds
# stay lean (infra component invariant).
rocksdb = ["totem-store/rocksdb"]

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Client-side transports for the tool-dispatch tests: a real rmcp client over
# stdio (tests/mcp_recall_and_save.rs, ADV-GATEWAY-002) and over streamable
# HTTP against a real loopback listener (tests/auth.rs, ADV-GATEWAY-003).
# Pinned exactly, matching totem-mcp-spike's pin: docs/tech-direction/mcp.md
# (ADV-GATEWAY-005) verified this exact version end-to-end and named
# re-verifying the pin at ADV-GATEWAY-002 time as a standing instruction.
rmcp = { version = "=3.1.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
tokio = { workspace = true, features = ["process", "time"] }

[lints]
workspace = true
