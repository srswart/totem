[package]
name = "totem-store-spike"
version = "0.1.0"
description = "ADV-STORE-004 investigation spike: SurrealDB multi-model recall, ACID writes, live queries"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Opt-in: runs the same experiments against a real `surreal start` server.
# Off by default so the workspace test build stays lean and never depends on a
# server being reachable. See tests/server_parity.rs. `protocol-http` is here
# solely so the ADV-STORE-006 test can prove the HTTP transport rejects live
# queries; nothing else may use it.
server-parity = ["surrealdb/protocol-ws", "surrealdb/protocol-http"]

[dependencies]
futures.workspace = true
# The exact pin lives in the workspace manifest: this spike's findings (query
# plans, operator names, knn syntax) are version-specific, and `totem-store`
# must be built against the same version they were measured on.
surrealdb = { workspace = true, features = ["kv-mem"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
