[package]
name = "totem-store"
version = "0.1.0"
description = "SurrealDB schema, migrations, and scope-isolating repositories for Totem memory"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The on-disk engine is opt-in. SurrealDB already dominates this workspace's
# compile time (docs/tech-direction/surrealdb.md §3: 5m02s cold on the cloud
# runner) and every test here uses the embedded `kv-mem` engine, so ephemeral
# runners must not pay for RocksDB they never touch.
rocksdb = ["surrealdb/kv-rocksdb"]

# The production embedder (BGE-small-en-v1.5 via `fastembed`) is opt-in for
# the same reason: first use downloads model weights, which the cloud
# sandbox's egress blocks (EMB-002/EMB-003, docs/tech-direction/embeddings.md).
# Off by default so `cargo test --workspace` never attempts that download;
# verified on a workstation with hub access, the ADV-STORE-006/007 split.
#
# This line lived inside the `[[test]]` table until ADV-STORE-008, where cargo
# read it as the unused key `test.0.fastembed` and ignored it. The feature
# resolved anyway — an optional dependency implies a feature of its own name —
# so nothing failed and nothing said so. Declared here now, where it is read.
fastembed = ["dep:fastembed"]

[[test]]
name = "durability"
required-features = ["rocksdb"]

[dependencies]
chrono.workspace = true
# The landscape live-query relay (ADV-CONSOLE-003) merges several `LIVE
# SELECT` notification streams into one trigger via `futures::stream::select_all`.
futures.workspace = true
# The landscape view types (`LandscapeView` and friends) are a read model the
# gateway returns directly over MCP/REST, the same way `totem-core`'s
# `MemoryRecord` already does for recall; the landscape artifact/snapshot
# types (`Deserialize`, ADV-CLI-001) are the write side of the same crossing —
# `totem-cli` sends a `LandscapeSnapshot` as JSON to the gateway's `POST
# /enroll` rather than opening its own store connection.
serde.workspace = true
# Pinned exactly, matching totem-embedding-spike's ADV-STORE-007 pin: EMB-004
# measured this exact version, and an upstream release changing inference
# behavior mid-project must not silently re-open that finding.
fastembed = { version = "=5.17.4", optional = true }
# `kv-mem` is not optional: the embedded engine is the store's test substrate
# and the console's live-query transport (TD-009). The exact version pin lives
# in the workspace manifest.
surrealdb = { workspace = true, features = ["kv-mem"] }
thiserror.workspace = true
totem-core = { path = "../totem-core" }

[dev-dependencies]
tempfile = "3"
# "time" backs the `watch()` test's timeout guard (ADV-CONSOLE-003), the same
# non-negotiable-in-a-real-feed pattern `totem-store-spike`'s live-query
# experiment already established.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
