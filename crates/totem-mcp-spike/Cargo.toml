[package]
name = "totem-mcp-spike"
version = "0.1.0"
description = "ADV-GATEWAY-005 investigation spike: rmcp echo server over stdio and streamable HTTP"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "echo_stdio"
path = "src/bin/echo_stdio.rs"

[[bin]]
name = "echo_streamhttp"
path = "src/bin/echo_streamhttp.rs"

[dependencies]
# Pinned exactly: this spike's findings about rmcp's macro and transport API
# shape are version-specific, and hourly cloud runs must not break because an
# upstream release changes rmcp mid-project (see ADV-STORE-004/003 precedent
# for surrealdb/ureq pins).
rmcp = { version = "=3.1.0", features = [
    "client",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
] }
axum = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.43.0", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-std",
    "process",
] }
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "io-std", "process", "time"] }

[lints]
workspace = true
