[workspace]
resolver = "3"
members = ["crates/totem-core"]

# Sibling crate slots per docs/solution-intent.md §7; each is added by the
# advance that first needs it, rather than landing as empty scaffolding here:
#   crates/totem-store        ADV-STORE-001
#   crates/totem-gateway      ADV-GATEWAY-001
#   crates/totem-arrive-sync  ADV-ARRIVE-SYNC-001
#   crates/totem-curator      ADV-CURATOR-001
#   crates/totem-cli          ADV-CLI-001
#   crates/totem-console      ADV-CONSOLE-001

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.11"
uuid = { version = "1.11.1", features = ["serde", "v4"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
unwrap_used = "warn"
